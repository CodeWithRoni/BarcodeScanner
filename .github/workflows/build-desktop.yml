name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the build (e.g. 1.2.0). Leave empty to use the version in tauri.conf.json."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (expected e.g. 1.2.0)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into package.json, Cargo.toml and tauri.conf.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8")); j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = "src-tauri/Cargo.toml";
            fs.writeFileSync(cargo, fs.readFileSync(cargo, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          '

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust unit tests
        if: runner.os == 'Linux'
        working-directory: desktop-app/src-tauri
        run: cargo test

      - name: Configure optional macOS code signing & notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export signing variables when the secrets exist; otherwise the
          # bundle is built ad-hoc signed, which runs after right-click → Open.
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "macOS code signing enabled"
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "macOS notarization enabled"
          fi

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop-app
          args: ${{ matrix.args }}

      - name: Collect installers
        id: collect
        run: |
          OUT="$GITHUB_WORKSPACE/dist-installers"
          mkdir -p "$OUT"
          shopt -s globstar nullglob
          for f in src-tauri/target/**/release/bundle/**/*.{exe,msi,dmg,deb,AppImage}; do
            cp "$f" "$OUT/"
          done
          ls -la "$OUT"
          if [[ -z "$(ls -A "$OUT")" ]]; then echo "::error::No installers were produced"; exit 1; fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: Create release if missing and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la installers
          # The mobile workflow publishes to the same release; whichever runs
          # first creates it and the other attaches its files.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "BarcodeSync $TAG" --generate-notes --verify-tag && break
            sleep $((attempt * 5))
          done
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
